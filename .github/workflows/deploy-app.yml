name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

permissions:
  contents: read

# Publish one deployment at a time and let active runs finish. This group is
# deliberately distinct from job-kit-release: a skill release and an app deploy
# touch nothing in common and must not serialize against each other.
concurrency:
  group: job-kit-app-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    # "VPS-Runner-job-kit" runs as r1cco-runner from /srv/r1cco-jobkit-runner
    # with the default labels. It is registered to this repository: the
    # rafaeelricco/me runner is repo-scoped and invisible here, and the owner
    # is a User account, so there is no org-level runner group to inherit.
    # Admins manage it from /srv/r1cco-jobkit-runner: sudo ./svc.sh status.
    # Keep its .path set to /usr/local/bin:/usr/bin:/bin so system tools resolve.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - name: Install dependencies
        # app/ is a standalone pnpm project with its own lockfile; an install at
        # the repository root resolves prettier and pyright only, none of the
        # dependencies this build needs.
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app
        run: pnpm lint

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Build
        working-directory: app
        run: pnpm build

      - name: Deploy
        # nginx serves this directory at https://r1cco.com/jobs/ from
        # `location ^~ /jobs/` with `root /var/www/r1cco.com/html`. The tree is
        # owned by r1cco-runner and must stay readable by www-data, so the
        # transfer sets modes explicitly rather than trusting the umask.
        # Vite bakes `base: "/jobs/"` into every asset URL at build time, so
        # this output is only valid at this exact path.
        # try_files on /jobs/ has no `=404` branch: a request for a missing
        # asset returns index.html with status 200, so a partially copied tree
        # fails as a blank page rather than a visible error. --delay-updates
        # keeps the swap as close to atomic as rsync gets.
        # Publication is local: no deployment SSH keys or repository secrets.
        # Direct rsync is not atomic and has no automatic rollback. Fix failures
        # before retrying; recover by reverting on main and letting this
        # workflow republish.
        shell: bash
        run: |
          set -euo pipefail
          test -s app/dist/index.html
          rsync -a --delete-delay --delay-updates \
            --no-owner --no-group --chmod=D755,F644 \
            app/dist/ /var/www/r1cco.com/html/jobs/
