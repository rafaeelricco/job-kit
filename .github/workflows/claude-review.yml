name: Claude review

# Reviews each pull request once, when it opens or leaves draft, with the
# official code-review plugin posting inline comments. Runs are billed to the
# Claude subscription behind CLAUDE_CODE_OAUTH_TOKEN, so it skips synchronize;
# comment "@claude review" to ask again. Fork PRs get no secrets and are skipped.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Claude review
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          # The plugin assigns haiku/sonnet/opus per subagent; force them all
          # onto Opus 5.5. Subagents inherit the session's --effort.
          CLAUDE_CODE_SUBAGENT_MODEL: claude-opus-5-5
          CLAUDE_CODE_SUBAGENT_MODEL_FORCE: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model claude-opus-5-5 --effort high --allowedTools "mcp__github_inline_comment__create_inline_comment"'
