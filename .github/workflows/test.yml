name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - ".gitattributes"
      - "LICENSE"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "skill/**"
      - "scripts/**"
      - "tests/**"
      - ".gitattributes"
      - "LICENSE"
      - ".github/workflows/test.yml"
      - ".github/workflows/release.yml"
  workflow_call:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The skills claim any Python 3 works and run under whatever `python3`
        # an operator happens to have. The matrix is what makes that claim true.
        python-version: ["3.9", "3.11", "3.13"]
    name: Python ${{ matrix.python-version }} test suite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Report Python version
        run: python3 -VV

      - name: Run full test suite
        run: bash scripts/test.sh

  shell:
    runs-on: ubuntu-latest
    name: Shell script syntax
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          status=0
          for script in scripts/*.sh scripts/aside/*.sh scripts/agents/*.sh scripts/browser-use/*.sh; do
            [ -e "$script" ] || continue
            bash -n "$script" || status=1
          done
          exit $status

  release_installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Release installers (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test release packaging and native installers
        run: python -m unittest discover -s tests -p test_release.py

      - name: Test browser channel native installers
        run: python -m unittest discover -s tests -p test_browser_install.py
