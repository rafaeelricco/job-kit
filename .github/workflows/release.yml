name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read

concurrency:
  group: job-kit-release
  cancel-in-progress: false
  queue: max

jobs:
  admission:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
      merge_sha: ${{ steps.admit.outputs.merge_sha }}
      bump: ${{ steps.admit.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SKIP_THROUGH_RUN: ${{ vars.RELEASE_SKIP_THROUGH_RUN || '0' }}
        run: python3 scripts/auto_release.py admit

  verify:
    needs: admission
    if: needs.admission.outputs.proceed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.admission.outputs.merge_sha }}

  publish:
    needs: [admission, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admission.outputs.merge_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Publish the verified merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admission.outputs.merge_sha }}
          RELEASE_BUMP: ${{ needs.admission.outputs.bump }}
        run: python3 scripts/auto_release.py publish --output dist
