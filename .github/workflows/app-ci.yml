name: App CI

# The app is not covered by test.yml: its paths filter is workflow-wide, so
# adding app/** there would run the Python and installer matrices for a change
# that cannot affect them. This workflow is the app's own gate, and it runs on
# GitHub-hosted infrastructure so that pull request code never executes on the
# self-hosted deployment runner.

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: App build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: app
        run: pnpm lint

      - name: Typecheck
        working-directory: app
        run: pnpm typecheck

      - name: Build
        working-directory: app
        run: pnpm build
