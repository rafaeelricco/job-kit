<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Badges</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
    <style>
      /* badge.tsx badgeVariants: h-5 px-2 py-0.5 text-xs font-medium, square (radius aliased to 0) */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 20px;
        padding: 2px 8px;
        border: 1px solid transparent;
        font: 500 12px var(--font-sans);
        white-space: nowrap;
      }
      /* default: bg-primary text-primary-foreground */
      .badge-default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      /* secondary: bg-secondary text-secondary-foreground */
      .badge-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      /* outline: border-border text-foreground */
      .badge-outline {
        background: transparent;
        border-color: var(--border);
        color: var(--foreground);
      }
      /* destructive: bg-destructive/10 text-destructive, dark:bg-destructive/20 */
      .badge-destructive {
        background: color-mix(in srgb, var(--destructive) 10%, transparent);
        color: var(--destructive);
      }
      .dark .badge-destructive {
        background: color-mix(in srgb, var(--destructive) 20%, transparent);
      }
      /* success: bg-success-surface text-success-strong */
      .badge-success {
        background: var(--success-surface);
        color: var(--success-strong);
      }

      .badge-row-label {
        font: 500 12px var(--font-sans);
        color: var(--ink-muted);
        margin: 16px 0 8px;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Badges — variants</p>
    <div class="row">
      <span class="badge badge-default">default</span>
      <span class="badge badge-secondary">secondary</span>
      <span class="badge badge-outline">outline</span>
      <span class="badge badge-destructive">destructive</span>
      <span class="badge badge-success">success</span>
    </div>

    <p class="badge-row-label">Status — raw enum text, no title-casing</p>
    <div class="row">
      <span class="badge badge-secondary">applied</span>
      <span class="badge badge-outline">restricted-geo</span>
      <span class="badge badge-destructive">dead</span>
    </div>
  </body>
</html>
