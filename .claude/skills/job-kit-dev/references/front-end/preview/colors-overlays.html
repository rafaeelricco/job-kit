<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overlays</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
  </head>
  <body>
    <p class="eyebrow">Overlays</p>
    <div class="frame stack">
      <div class="row" style="align-items: center">
        <div
          style="width: 200px; height: 36px; background: var(--hover-overlay); border: 1px solid var(--divider)"
        ></div>
        <span class="label">hover-overlay</span>
        <code class="value" data-token="--hover-overlay"></code>
        <span class="note">Row hover</span>
      </div>
      <div class="row" style="align-items: center">
        <div
          style="width: 200px; height: 36px; background: var(--hover-overlay-strong); border: 1px solid var(--divider)"
        ></div>
        <span class="label">hover-overlay-strong</span>
        <code class="value" data-token="--hover-overlay-strong"></code>
        <span class="note">Pressed, active row</span>
      </div>
    </div>

    <p class="eyebrow" style="margin-top: 16px">Modal scrim</p>
    <div
      style="
        position: relative;
        height: 130px;
        background: var(--canvas);
        border: 1px solid var(--divider);
        overflow: hidden;
      "
    >
      <div style="position: absolute; inset: 0; padding: 12px">
        <span class="label">Page content behind the scrim</span>
      </div>
      <div
        style="
          position: absolute;
          inset: 0;
          background: color-mix(in srgb, var(--ink-strong) 20%, transparent);
          backdrop-filter: blur(4px);
        "
      ></div>
      <div class="frame" style="position: absolute; top: 20px; left: 20px; width: 160px; z-index: 1">
        <span class="label">Dialog</span>
      </div>
    </div>
    <p class="note">ink-strong at 20% with backdrop-blur-xs — the sole decorative blur in the system.</p>
  </body>
</html>
