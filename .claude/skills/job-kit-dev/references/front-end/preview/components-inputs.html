<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inputs</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
    <style>
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 220px;
      }
      .field-label {
        font: 500 14px var(--font-sans);
        color: var(--ink-strong);
      }
      .field-helper {
        font: 12px var(--font-sans);
        color: var(--ink-muted);
      }

      /* input.tsx: h-9 border-input bg-input-surface px-3 text-sm, dark:bg-input/30 */
      .input {
        box-sizing: border-box;
        height: 36px;
        width: 100%;
        border: 1px solid var(--input);
        background: var(--input-surface);
        padding: 0 12px;
        font: 14px var(--font-sans);
        color: var(--foreground);
        outline: none;
      }
      .input::placeholder {
        color: var(--muted-foreground);
      }
      .input:focus-visible,
      .input.is-focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent);
      }
      .input:disabled,
      .input.is-disabled {
        opacity: 0.5;
        background: color-mix(in srgb, var(--input) 50%, transparent);
        cursor: not-allowed;
      }
      .dark .input {
        background: color-mix(in srgb, var(--input) 30%, transparent);
      }
      .dark .input:disabled,
      .dark .input.is-disabled {
        background: color-mix(in srgb, var(--input) 80%, transparent);
      }
      .input.is-invalid {
        border-color: var(--destructive);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--destructive) 20%, transparent);
      }
      .dark .input.is-invalid {
        border-color: color-mix(in srgb, var(--destructive) 50%, transparent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--destructive) 40%, transparent);
      }

      /* textarea.tsx: min-h-16 border-input bg-transparent px-2.5 py-2 text-sm, dark:bg-input/30 */
      .textarea {
        box-sizing: border-box;
        min-height: 64px;
        width: 100%;
        border: 1px solid var(--input);
        background: transparent;
        padding: 8px 10px;
        font: 14px var(--font-sans);
        color: var(--foreground);
        outline: none;
        resize: vertical;
      }
      .textarea::placeholder {
        color: var(--muted-foreground);
      }
      .textarea:focus-visible,
      .textarea.is-focus {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent);
      }
      .dark .textarea {
        background: color-mix(in srgb, var(--input) 30%, transparent);
      }

      /* checkbox.tsx: size-4 border-input square, data-checked: bg-primary border-primary */
      .checkbox {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        border: 1px solid var(--input);
        background: transparent;
        color: var(--primary-foreground);
      }
      .dark .checkbox {
        background: color-mix(in srgb, var(--input) 30%, transparent);
      }
      .checkbox svg {
        width: 14px;
        height: 14px;
        display: none;
      }
      .checkbox.is-checked {
        border-color: var(--primary);
        background: var(--primary);
      }
      .checkbox.is-checked svg {
        display: block;
      }

      /* switch.tsx: track w-8 h-[18.4px] rounded-full, data-checked:bg-primary data-unchecked:bg-input */
      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 32px;
        height: 18.4px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--input);
        transition: background-color 0.15s;
      }
      .dark .switch {
        background: color-mix(in srgb, var(--input) 80%, transparent);
      }
      .switch.is-on {
        background: var(--primary);
      }
      .switch-thumb {
        position: absolute;
        left: 1px;
        width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--background);
        transition: transform 0.15s;
      }
      .switch.is-on .switch-thumb {
        transform: translateX(calc(100% - 2px));
      }
      .dark .switch.is-on .switch-thumb {
        background: var(--primary-foreground);
      }
      .dark .switch:not(.is-on) .switch-thumb {
        background: var(--foreground);
      }

      .control-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font: 14px var(--font-sans);
        color: var(--foreground);
      }

      /* trimmed button.tsx recipe, only what the Save/Reset pair needs */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 36px;
        padding: 0 16px;
        border: 1px solid transparent;
        font: 500 14px var(--font-sans);
        cursor: pointer;
      }
      .btn:disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-ghost {
        background: transparent;
        color: var(--foreground);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Inputs & controls</p>

    <div class="stack">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input" id="email" type="text" placeholder="you@example.com" />
        <span class="field-helper">We only use this to send interview replies.</span>
      </div>

      <div class="row">
        <div class="field" style="width: 160px">
          <span class="field-label">Default</span>
          <input class="input" type="text" value="Ada Lovelace" readonly />
        </div>
        <div class="field" style="width: 160px">
          <span class="field-label">Focus</span>
          <input class="input is-focus" type="text" value="Ada Lovelace" readonly />
        </div>
        <div class="field" style="width: 160px">
          <span class="field-label">Disabled</span>
          <input class="input" type="text" value="Ada Lovelace" disabled />
        </div>
        <div class="field" style="width: 180px">
          <span class="field-label">aria-invalid</span>
          <input class="input is-invalid" type="text" value="not-an-email" aria-invalid="true" readonly />
          <span class="field-helper" style="color: var(--destructive)">Enter a valid email.</span>
        </div>
      </div>

      <div class="field" style="width: 460px">
        <label class="field-label" for="notes">Notes</label>
        <textarea class="textarea" id="notes" rows="3" placeholder="Add context for the reviewer…"></textarea>
      </div>

      <div class="row">
        <label class="control-label">
          <span class="checkbox"></span>
          Unchecked
        </label>
        <label class="control-label">
          <span class="checkbox is-checked">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </span>
          Checked
        </label>
      </div>

      <div class="row">
        <label class="control-label">
          <span class="switch"><span class="switch-thumb"></span></span>
          Off
        </label>
        <label class="control-label">
          <span class="switch is-on"><span class="switch-thumb"></span></span>
          On
        </label>
      </div>

      <div>
        <p class="note" style="margin-bottom: 6px">Form actions — Save + ghost Reset, disabled until dirty</p>
        <div class="row">
          <button class="btn btn-default" disabled>Save</button>
          <button class="btn btn-ghost" disabled>Reset</button>
        </div>
      </div>
      <div>
        <p class="note" style="margin-bottom: 6px">Enabled once the form is dirty</p>
        <div class="row">
          <button class="btn btn-default">Save</button>
          <button class="btn btn-ghost">Reset</button>
        </div>
      </div>
    </div>
  </body>
</html>
