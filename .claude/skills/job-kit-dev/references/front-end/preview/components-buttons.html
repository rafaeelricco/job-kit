<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buttons</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
    <style>
      /* button.tsx buttonVariants: base string + variant + size, translated 1:1. */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px solid transparent;
        font: 500 14px/1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s,
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        pointer-events: none;
      }
      .btn:disabled,
      .btn.is-disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .btn:focus-visible,
      .btn.is-focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 50%, transparent);
      }

      /* variant: default -> bg-primary text-primary-foreground hover:bg-primary/80 */
      .btn-default {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .btn-default:hover,
      .btn-default.is-hover {
        background: color-mix(in srgb, var(--primary) 80%, transparent);
      }

      /* variant: outline -> border-border bg-background hover:bg-muted, dark:border-input dark:bg-input/30 */
      .btn-outline {
        background: var(--background);
        color: var(--ink-soft);
        border-color: var(--border);
      }
      .btn-outline:hover,
      .btn-outline.is-hover {
        background: var(--muted);
        color: var(--foreground);
      }
      .dark .btn-outline {
        border-color: var(--input);
        background: color-mix(in srgb, var(--input) 30%, transparent);
      }
      .dark .btn-outline:hover,
      .dark .btn-outline.is-hover {
        background: color-mix(in srgb, var(--input) 50%, transparent);
      }

      /* variant: secondary -> bg-secondary text-secondary-foreground hover:bg-[color-mix(...5%)] */
      .btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }
      .btn-secondary:hover,
      .btn-secondary.is-hover {
        background: color-mix(in srgb, var(--secondary), var(--foreground) 5%);
      }

      /* variant: ghost -> hover:bg-muted hover:text-foreground, dark:hover:bg-muted/50 */
      .btn-ghost {
        background: transparent;
        color: var(--foreground);
        border-color: transparent;
      }
      .btn-ghost:hover,
      .btn-ghost.is-hover {
        background: var(--muted);
      }
      .dark .btn-ghost:hover,
      .dark .btn-ghost.is-hover {
        background: color-mix(in srgb, var(--muted) 50%, transparent);
      }

      /* variant: destructive -> bg-destructive/10 text-destructive hover:bg-destructive/20, dark:/20 dark:hover:/30 */
      .btn-destructive {
        background: color-mix(in srgb, var(--destructive) 10%, transparent);
        color: var(--destructive);
      }
      .btn-destructive:hover,
      .btn-destructive.is-hover {
        background: color-mix(in srgb, var(--destructive) 20%, transparent);
      }
      .dark .btn-destructive {
        background: color-mix(in srgb, var(--destructive) 20%, transparent);
      }
      .dark .btn-destructive:hover,
      .dark .btn-destructive.is-hover {
        background: color-mix(in srgb, var(--destructive) 30%, transparent);
      }

      /* variant: link -> text-primary underline-offset-4 hover:underline */
      .btn-link {
        background: transparent;
        border-color: transparent;
        color: var(--primary);
        padding: 0;
        height: auto;
      }
      .btn-link:hover,
      .btn-link.is-hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      /* sizes: xs h-6 · sm h-7 · default/lg h-9 · icon size-8 · icon-sm size-7 · icon-lg size-9 */
      .btn-size-xs {
        height: 24px;
        padding: 0 8px;
        font-size: 12px;
        gap: 4px;
      }
      .btn-size-sm {
        height: 28px;
        padding: 0 10px;
        font-size: 13px;
        gap: 4px;
      }
      .btn-size-default {
        height: 36px;
        padding: 0 16px;
      }
      .btn-size-lg {
        height: 36px;
        padding: 0 10px;
      }
      .btn-size-icon {
        height: 32px;
        width: 32px;
        padding: 0;
      }
      .btn-size-icon-sm {
        height: 28px;
        width: 28px;
        padding: 0;
      }
      .btn-size-icon-lg {
        height: 36px;
        width: 36px;
        padding: 0;
      }

      .state-grid {
        display: grid;
        grid-template-columns: 92px repeat(4, minmax(88px, auto));
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      .state-grid .col-label {
        font: 600 11px var(--font-mono);
        color: var(--ink-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .state-grid .row-label {
        font: 500 12px var(--font-sans);
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">Buttons · variant × state</p>

    <div class="state-grid">
      <span></span>
      <span class="col-label">Default</span>
      <span class="col-label">Hover</span>
      <span class="col-label">Focus</span>
      <span class="col-label">Disabled</span>
    </div>

    <div class="state-grid">
      <span class="row-label">default</span>
      <button class="btn btn-default btn-size-default">Save</button>
      <button class="btn btn-default btn-size-default is-hover">Save</button>
      <button class="btn btn-default btn-size-default is-focus">Save</button>
      <button class="btn btn-default btn-size-default" disabled>Save</button>
    </div>

    <div class="state-grid">
      <span class="row-label">outline</span>
      <button class="btn btn-outline btn-size-default">Cancel</button>
      <button class="btn btn-outline btn-size-default is-hover">Cancel</button>
      <button class="btn btn-outline btn-size-default is-focus">Cancel</button>
      <button class="btn btn-outline btn-size-default" disabled>Cancel</button>
    </div>

    <div class="state-grid">
      <span class="row-label">secondary</span>
      <button class="btn btn-secondary btn-size-default">Filter</button>
      <button class="btn btn-secondary btn-size-default is-hover">Filter</button>
      <button class="btn btn-secondary btn-size-default is-focus">Filter</button>
      <button class="btn btn-secondary btn-size-default" disabled>Filter</button>
    </div>

    <div class="state-grid">
      <span class="row-label">ghost</span>
      <button class="btn btn-ghost btn-size-default">Reset</button>
      <button class="btn btn-ghost btn-size-default is-hover">Reset</button>
      <button class="btn btn-ghost btn-size-default is-focus">Reset</button>
      <button class="btn btn-ghost btn-size-default" disabled>Reset</button>
    </div>

    <div class="state-grid">
      <span class="row-label">destructive</span>
      <button class="btn btn-destructive btn-size-default">Delete</button>
      <button class="btn btn-destructive btn-size-default is-hover">Delete</button>
      <button class="btn btn-destructive btn-size-default is-focus">Delete</button>
      <button class="btn btn-destructive btn-size-default" disabled>Delete</button>
    </div>

    <div class="state-grid">
      <span class="row-label">link</span>
      <button class="btn btn-link">View source</button>
      <button class="btn btn-link is-hover">View source</button>
      <button class="btn btn-link is-focus">View source</button>
      <button class="btn btn-link" disabled>View source</button>
    </div>

    <p class="eyebrow" style="margin-top: 24px">Sizes — xs · sm · default · lg · icon · icon-sm · icon-lg</p>
    <div class="row" style="align-items: center">
      <button class="btn btn-default btn-size-xs">xs</button>
      <button class="btn btn-default btn-size-sm">sm</button>
      <button class="btn btn-default btn-size-default">default</button>
      <button class="btn btn-default btn-size-lg">lg</button>
      <button class="btn btn-default btn-size-icon" aria-label="Add">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button class="btn btn-outline btn-size-icon-sm" aria-label="Add">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
      <button class="btn btn-ghost btn-size-icon-lg" aria-label="Add">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </div>
  </body>
</html>
