<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shell</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
  </head>
  <body>
    <p class="eyebrow">Shell · sidebar, collapsed rail, settings rail</p>

    <div class="stack">
      <div class="stack" style="gap: 6px">
        <span class="note" style="margin: 0; font-weight: 600; color: var(--ink-strong)">Sidebar rail — expanded</span>
        <div class="canvas" style="padding: 0; display: flex; height: 110px; overflow: hidden">
          <div
            style="
              width: 256px;
              background: var(--sidebar);
              box-sizing: border-box;
              padding: 10px;
              display: flex;
              align-items: flex-end;
            "
          >
            <span class="label">256px · sidebar</span>
          </div>
          <div
            style="
              flex: 1;
              background: var(--surface);
              border-left: 1px solid var(--divider);
              box-sizing: border-box;
              padding: 10px;
              display: flex;
              align-items: flex-end;
            "
          >
            <span class="label">content pane · fluid · bg-surface, 1px left divider</span>
          </div>
        </div>
      </div>

      <div class="stack" style="gap: 6px">
        <span class="note" style="margin: 0; font-weight: 600; color: var(--ink-strong)">Sidebar rail — collapsed</span>
        <div class="canvas" style="padding: 0; display: flex; height: 80px; overflow: hidden">
          <div
            style="
              width: 48px;
              background: var(--sidebar);
              box-sizing: border-box;
              padding: 6px;
              display: flex;
              align-items: flex-end;
            "
          >
            <span class="label" style="font-size: 11px">48px</span>
          </div>
          <div
            style="
              flex: 1;
              background: var(--surface);
              border-left: 1px solid var(--divider);
              box-sizing: border-box;
              padding: 10px;
              display: flex;
              align-items: flex-end;
            "
          >
            <span class="label">collapsed rail · icon-only</span>
          </div>
        </div>
      </div>

      <div class="stack" style="gap: 6px">
        <span class="note" style="margin: 0; font-weight: 600; color: var(--ink-strong)"
          >Settings rail — inside a dialog</span
        >
        <div
          class="frame"
          style="padding: 0; display: flex; height: 120px; overflow: hidden; background: var(--popover)"
        >
          <div
            style="
              width: 192px;
              border-right: 1px solid var(--divider);
              box-sizing: border-box;
              padding: 10px;
              display: flex;
              align-items: flex-end;
            "
          >
            <span class="label">192px · settings rail</span>
          </div>
          <div style="flex: 1; box-sizing: border-box; padding: 10px; display: flex; align-items: flex-end">
            <span class="label">dialog content · 896×720 at full size</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
