<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Charts</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
  </head>
  <body>
    <p class="eyebrow">Charts · Tokyo-Night ramp, assigned by series index — never by meaning</p>
    <div class="row" style="align-items: flex-end">
      <div class="stack" style="align-items: center; gap: 6px">
        <div style="width: 32px; height: 96px; background: var(--chart-1)"></div>
        <span class="label">chart-1</span>
        <code class="value" data-token="--chart-1"></code>
      </div>
      <div class="stack" style="align-items: center; gap: 6px">
        <div style="width: 32px; height: 72px; background: var(--chart-2)"></div>
        <span class="label">chart-2</span>
        <code class="value" data-token="--chart-2"></code>
      </div>
      <div class="stack" style="align-items: center; gap: 6px">
        <div style="width: 32px; height: 112px; background: var(--chart-3)"></div>
        <span class="label">chart-3</span>
        <code class="value" data-token="--chart-3"></code>
      </div>
      <div class="stack" style="align-items: center; gap: 6px">
        <div style="width: 32px; height: 64px; background: var(--chart-4)"></div>
        <span class="label">chart-4</span>
        <code class="value" data-token="--chart-4"></code>
      </div>
      <div class="stack" style="align-items: center; gap: 6px">
        <div style="width: 32px; height: 88px; background: var(--chart-5)"></div>
        <span class="label">chart-5</span>
        <code class="value" data-token="--chart-5"></code>
      </div>
    </div>
    <p class="note">
      components/ui/chart.tsx carries no palette of its own; callers pass colors through ChartConfig, which emits them
      as --color-&lt;key&gt;.
    </p>
  </body>
</html>
