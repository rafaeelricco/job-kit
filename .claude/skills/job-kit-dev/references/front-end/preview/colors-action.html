<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Action</title>
    <link rel="stylesheet" href="./preview.css" />
    <script src="./shard.js" defer></script>
  </head>
  <body>
    <p class="eyebrow">Action · neutral near-black, no brand hue in the UI</p>
    <div class="grid">
      <div class="swatch">
        <span class="chip" style="background: var(--primary)"></span>
        <span class="label">primary</span>
        <code class="value" data-token="--primary"></code>
        <span class="note">Primary button fill, focus</span>
      </div>
      <div class="swatch">
        <span class="chip" style="background: var(--primary-hover)"></span>
        <span class="label">primary-hover</span>
        <code class="value" data-token="--primary-hover"></code>
        <span class="note">Primary hover</span>
      </div>
      <div class="swatch">
        <span class="chip" style="background: var(--secondary)"></span>
        <span class="label">secondary</span>
        <code class="value" data-token="--secondary"></code>
        <span class="note">Secondary fill</span>
      </div>
      <div class="swatch">
        <span class="chip" style="background: var(--destructive)"></span>
        <span class="label">destructive</span>
        <code class="value" data-token="--destructive"></code>
        <span class="note">Destructive action, error</span>
      </div>
    </div>

    <p class="eyebrow" style="margin-top: 16px">Link</p>
    <p style="margin: 0">
      <span style="color: var(--link)">Inline text links</span> render in
      <code class="value" data-token="--link"></code>, underlined on hover.
    </p>
  </body>
</html>
