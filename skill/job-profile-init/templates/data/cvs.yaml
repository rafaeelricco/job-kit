# The one CV job-apply attaches. job-profile-me edits this file.
# base = filename under `cv/`; must open as a PDF. NEVER a `.tex`.
# The LaTeX source job-resume-refine copies is the same stem with `.tex`.
# adapt_per_vacancy = true → job-apply chains job-resume-refine on a
# status:new dossier and attaches the tailored PDF. false → attach `base`
# unchanged. Absent key → true.
# Absent file or empty `base` → job-apply falls back to cv/en-us-resume.pdf.

base: ""
adapt_per_vacancy: true
