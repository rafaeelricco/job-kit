availability:
  notice_period: "" # TODO e.g. "2 weeks"

salary_expectations:
  # How job-apply answers a salary question from this band and the posting's
  # printed figures: job-apply/references/contracts/contract-screening.md, Salary expectation.
  salary_range_usd: "" # TODO e.g. "80000-120000"

# No self-identification block, deliberately. EEO / demographic questions are
# voluntary and per-employer; answer them in the ATS form at apply time.
# No kit skill stages protected-class data from a file.

legal_authorization:
  # One row per country. job-apply reads the row whose `country` matches the
  # question (`job-apply/references/contracts/contract-screening.md`); job-match reads the
  # row matching the posting; job-profile-me shows and edits them. A country
  # with no row has no stored answer — never copy another row onto it. Profiles
  # that still carry the old us_*/eu_*/canada_*/uk_* scalars and no
  # `jurisdictions` list keep them readable.
  jurisdictions: [] # TODO each: {country, work_authorization, legally_allowed_to_work, requires_visa, requires_sponsorship}

employment_routes:
  employer_of_record: "" # Yes | No: gates EOR report eligibility
  direct_contractor: ""
  local_employment: ""

work_preferences_from_resume:
  remote_work: ""
  in_person_work: ""
  in_person_work_note: ""
  open_to_relocation: ""

# Read by job-apply resolution rule 3. Absent key → later rules apply.
# qa: label-matched pairs, e.g. {question: "Why us?", answer: "..."}.
screening_defaults:
  on_call: ""
  hours_overlap: ""
  timezone: ""
  referral_source: ""
  consent_to_data_processing: ""
  qa: []
