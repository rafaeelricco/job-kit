availability:
  notice_period: "" # TODO e.g. "2 weeks"

salary_expectations:
  tip: "Stay inside the printed USD band. Empty ours or non-USD → surface. Job min >= our max → midpoint, or the min if no max. Else → job max, or our max if no max. No printed salary → our max. Range → high is that figure; low is job min when printed and ≤ high, else high; no job numbers → our range."
  salary_range_usd: "" # TODO e.g. "80000-120000"

# No self-identification block, deliberately. EEO / demographic questions are
# voluntary and per-employer; answer them in the ATS form at apply time.
# job-application must never stage protected-class data from a file — the whole
# Fact card is pasted verbatim into every drafting brief.

legal_authorization:
  # The four answers below hold for every country in `countries` and for no
  # other. A jurisdiction not listed has no stored answer — job-application
  # surfaces it, never infers one from a country that is listed.
  work_authorization: ""
  legally_allowed_to_work: ""
  requires_visa: ""
  requires_sponsorship: ""
  countries: [] # TODO e.g. ["br", "us", "eu"] — any country, not a fixed set

employment_routes:
  employer_of_record: "" # Yes | No: gates the EOR bucket
  direct_contractor: ""
  local_employment: ""

work_preferences_from_resume:
  remote_work: ""
  in_person_work: ""
  in_person_work_note: ""
  open_to_relocation: ""
