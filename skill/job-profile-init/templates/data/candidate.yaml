availability:
  notice_period: "" # TODO e.g. "2 weeks"

salary_expectations:
  tip: "Answer from the job's printed USD numbers whenever it prints any; our band decides only when it prints none. Ours empty or job pay non-USD → surface, never convert. Job printed both ends: job min >= our max → midpoint of the JOB band; else job max. Job printed min only: job min >= our max → job min; else our max. Job printed max only → job max. Job printed neither → our max. A midpoint of our band is never the answer. Range → high is that figure; low is the job min when printed and ≤ high, else high; job printed nothing → our range."
  salary_range_usd: "" # TODO e.g. "80000-120000"

# No self-identification block, deliberately. EEO / demographic questions are
# voluntary and per-employer; answer them in the ATS form at apply time.
# job-apply must never stage protected-class data from a file — the whole
# Fact card is pasted verbatim into every drafting brief.

legal_authorization:
  # One row per country. job-apply reads only the row whose `country` matches
  # the question. A country with no row has no stored answer — never copy
  # another row onto it. Profiles that still have the old us_*/eu_*/canada_*/uk_*
  # scalars and no `jurisdictions` list: apply reads those keys (contract-draft).
  jurisdictions: [] # TODO each: {country, work_authorization, legally_allowed_to_work, requires_visa, requires_sponsorship}

employment_routes:
  employer_of_record: "" # Yes | No: gates the EOR bucket
  direct_contractor: ""
  local_employment: ""

work_preferences_from_resume:
  remote_work: ""
  in_person_work: ""
  in_person_work_note: ""
  open_to_relocation: ""
