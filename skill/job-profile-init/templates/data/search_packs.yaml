# Intent packs for job scout. One pack = one surface × one intent.
# job-scout reads this file from the Profile root; the copy inside the job-scout
# skill is a fallback used only when this file is absent.
# impl → file stem under job-scout references/ (e.g. surface-linkedin-jobs).
# [role] = job_search.yaml positions. [skill:<group>] = keywords.<group>.
# [industry] = profile card. Create the group in job_search.yaml before naming it here.
# enabled: false keeps a pack in the file but out of the run (absent = true).

max_parallel: 5
# SSOT for extract batch size — pipeline + worker must name this key, never hard-code
extract_batch_size: 5

packs:
  - id: li-jobs-core
    impl: surface-linkedin-jobs
    surface: linkedin_jobs
    entry: https://www.linkedin.com/jobs/
    enabled: true
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[skill:primary] engineer [skill:hiring_model]"

  - id: hn-whoishiring
    impl: surface-open-web
    surface: hn
    entry: https://hnhiring.com
    enabled: true
    formulations:
      - "[role]"
      - "[skill:primary]"
      - "[role] [skill:hiring_model]"

  - id: waas
    impl: surface-open-web
    surface: waas
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    enabled: true
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - '(founding OR "early-stage") [role]'

  - id: boards-tier1
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_1_high_alpha
    enabled: true
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[skill:primary] [skill:hiring_model]"

  - id: boards-tier2
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_2_aggregators
    enabled: true
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [industry]"

  - id: boards-baseline
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml baseline_floor
    enabled: true
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[role] [industry] [skill:hiring_model]"

  - id: li-jobs-hybrid
    impl: surface-linkedin-jobs
    surface: linkedin_jobs
    entry: https://www.linkedin.com/jobs/
    enabled: true
    formulations:
      - "[role] [industry]"
      - "[skill:primary] [skill:hiring_model]"
      - "[role] ([skill:primary] OR [industry])"

  - id: li-posts-en
    impl: surface-social
    surface: linkedin_posts
    entry: https://www.linkedin.com/search/results/content/
    enabled: true
    formulations:
      - '("we''re hiring" OR "now hiring") [role]'
      - '("open role" OR "join our team") [skill:primary]'
      - "hiring [role] [skill:hiring_model]"

  - id: x-dm-me
    impl: surface-social
    surface: x
    entry: https://x.com/search?f=live
    enabled: true
    formulations:
      - 'hiring "DM me" [role]'
      - '"we''re hiring" ("email me" OR "send CV") [role]'
      - "[role] hiring (DM OR email)"

  - id: x-funding
    impl: surface-social
    surface: x
    entry: https://x.com/search?f=live
    enabled: true
    formulations:
      - '("just raised" OR "Series A" OR "seed round") hiring [role]'
      - '"out of stealth" hiring [role]'
      - "raised hiring [skill:primary]"

  - id: people-ta
    impl: surface-people
    surface: people
    entry: https://www.linkedin.com/search/results/people/
    enabled: true
    formulations:
      - '("Tech Recruiter" OR "Talent Acquisition") [industry]'
      - '"Engineering Recruiter" ([industry] OR [skill:primary])'
      - "Recruiter [industry] [role]"
