# Intent packs for job scout. One pack = one site × one intent.
# job-scout reads this file from the Profile root; the copy inside the job-scout
# skill is a fallback used only when this file is absent.
# surface → ./references/worker-search-{surface}.md in job-scout: the playbook to run.
# entry = the one URL this pack starts from.
# [role] = job_search.yaml positions. [skill:<group>] = keywords.<group>.
# [industry] = profile card. Create the group in job_search.yaml before naming it here.
# enabled: false keeps a pack in the file but out of the run (absent = true).

packs:
  - id: linkedin-jobs
    surface: linkedin-jobs
    entry: https://www.linkedin.com/jobs/
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[skill:primary] engineer [skill:hiring_model]"
      - "[role] [industry]"

  - id: hn-hiring
    surface: open-web
    entry: https://hnhiring.com
    formulations:
      - "[role]"
      - "[skill:primary]"
      - "[role] [skill:hiring_model]"

  - id: work-at-a-startup
    surface: open-web
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - '(founding OR "early-stage") [role]'

  - id: we-work-remotely
    surface: open-web
    entry: https://weworkremotely.com
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [industry]"

  - id: himalayas
    surface: open-web
    entry: https://himalayas.app
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [industry]"

  - id: hiring-cafe
    surface: open-web
    entry: https://hiring.cafe
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [industry]"

  - id: greenhouse
    surface: open-web
    entry: https://job-boards.greenhouse.io
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[role] [industry] [skill:hiring_model]"

  - id: lever
    surface: open-web
    entry: https://jobs.lever.co
    formulations:
      - "[role]"
      - "[role] [skill:primary]"
      - "[role] [industry] [skill:hiring_model]"

  - id: linkedin-posts
    surface: social
    entry: https://www.linkedin.com/search/results/content/
    formulations:
      - '("we''re hiring" OR "now hiring") [role]'
      - '("open role" OR "join our team") [skill:primary]'
      - "hiring [role] [skill:hiring_model]"

  - id: x-dm-me
    surface: social
    entry: https://x.com/search?f=live
    formulations:
      - 'hiring "DM me" [role]'
      - '"we''re hiring" ("email me" OR "send CV") [role]'
      - "[role] hiring (DM OR email)"

  - id: x-funding
    surface: social
    entry: https://x.com/search?f=live
    formulations:
      - '("just raised" OR "Series A" OR "seed round") hiring [role]'
      - '"out of stealth" hiring [role]'
      - "raised hiring [skill:primary]"

  - id: dice
    surface: open-web
    entry: https://www.dice.com/jobs
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [skill:hiring_model]"

  - id: getonbrd
    surface: open-web
    entry: https://getonbrd.com/jobs
    formulations:
      - "[role]"
      - "[skill:primary] [role]"
      - "[role] [skill:hiring_model]"
