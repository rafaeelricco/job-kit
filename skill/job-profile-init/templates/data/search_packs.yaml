# Intent packs for job scout. One pack = one site × one intent.
# job-scout reads this file from the Profile root only (required).
# surface is a label (linkedin-jobs, open-web, social, …); scout opens entry.
# entry = the one URL this pack starts from.
# [role] = job_search.yaml positions.
# [industry] = profile card.
# enabled: false keeps a pack in the file but out of the run (absent = true).
# route_required: true means DOM search is not viable; an enabled pack needs route.
# route is optional; kind: json requires url, pages, items, and posting_url.
# url substitutes percent-encoded {formulation} and 1-based {page}; response
# fields are dot paths, with posting_url resolved inside each item.
# A route url is fixed: it carries no constraint filters, so work_model,
# date_posted, job_types, and location fall to scout's keep gate.
# kind: board requires ats, url with {slug}, and items, posting_url, title dot
# paths (location, date, listed optional); slugs come from data/boards.yaml
# rows whose ats matches. items: $ is the response root.
# location: keep-only marks a surface whose location control cannot express
# kit locations (absent, non-persisting, inert, or a taxonomy that hides
# remote-worldwide cards). Under listed, scout runs each formulation once with
# the location control unset and applies locations at the keep gate only.
# Absent = scout sets the surface location control.

packs:
  - id: linkedin-jobs
    surface: linkedin-jobs
    entry: https://www.linkedin.com/jobs/
    formulations:
      - "[role]"

  - id: hn-hiring
    surface: open-web
    entry: https://hnhiring.com
    # Location slugs are cities and Remote; kit country names never match.
    location: keep-only
    formulations:
      - "[role]"

  - id: work-at-a-startup
    surface: open-web
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    # The location control does not persist a country; the view stays Remote.
    location: keep-only
    formulations:
      - "[role]"

  - id: wellfound
    surface: open-web
    entry: https://wellfound.com
    formulations:
      - "[role]"

  - id: we-work-remotely
    surface: open-web
    entry: https://weworkremotely.com
    # country[] has no Anywhere option; a country filter hides worldwide cards.
    location: keep-only
    formulations:
      - "[role]"

  - id: himalayas
    surface: open-web
    entry: https://himalayas.app
    formulations:
      - "[role]"

  - id: remote-ok
    surface: open-web
    entry: https://remoteok.com
    formulations:
      - "[role]"

  - id: hiring-cafe
    surface: open-web
    entry: https://hiring.cafe
    # Search is SSR-only, which the generic JSON route does not support.
    route_required: true
    enabled: false
    formulations:
      - "[role]"

  - id: greenhouse
    surface: open-web
    entry: https://job-boards.greenhouse.io
    # Undated search-engine site: harvest; stale rows read dead at extract.
    # Prefer greenhouse-boards once data/boards.yaml has rows for this family.
    formulations:
      - "[role]"

  - id: lever
    surface: open-web
    entry: https://jobs.lever.co
    # Undated search-engine site: harvest; stale rows read dead at extract.
    # Prefer lever-boards once data/boards.yaml has rows for this family.
    formulations:
      - "[role]"

  - id: ashby-boards
    surface: open-web
    entry: https://jobs.ashbyhq.com
    route_required: true
    route:
      kind: board
      ats: ashby
      url: https://api.ashbyhq.com/posting-api/job-board/{slug}?includeCompensation=true
      items: jobs
      posting_url: jobUrl
      title: title
      location: location
      date: publishedAt
      listed: isListed
    formulations:
      - "[role]"

  - id: greenhouse-boards
    surface: open-web
    entry: https://job-boards.greenhouse.io
    route_required: true
    route:
      kind: board
      ats: greenhouse
      url: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs?content=true
      items: jobs
      posting_url: absolute_url
      title: title
      location: location.name
      date: updated_at
    formulations:
      - "[role]"

  - id: lever-boards
    surface: open-web
    entry: https://jobs.lever.co
    route_required: true
    route:
      kind: board
      ats: lever
      url: https://api.lever.co/v0/postings/{slug}?mode=json
      items: $
      posting_url: hostedUrl
      title: text
      location: categories.location
      date: createdAt
    formulations:
      - "[role]"

  - id: linkedin-posts
    surface: social
    entry: https://www.linkedin.com/search/results/content/
    # Posts content search has no location control; Anywhere is the only view.
    location: keep-only
    formulations:
      - '"we''re hiring" [role]'
      - '"now hiring" [role]'
      - '"open role" [role]'
      - '"join our team" [role]'
      - "hiring [role]"

  - id: x-dm-me
    surface: social
    entry: https://x.com/search?f=live
    # Live search has no location control; Anywhere is the only view.
    location: keep-only
    formulations:
      - 'hiring "DM me" [role]'
      - '"we''re hiring" "email me" [role]'
      - '"we''re hiring" "send CV" [role]'
      - "[role] hiring DM"
      - "[role] hiring email"

  - id: x-funding
    surface: social
    entry: https://x.com/search?f=live
    # Live search has no location control; Anywhere is the only view.
    location: keep-only
    formulations:
      - '"just raised" hiring [role]'
      - '"Series A" hiring [role]'
      - '"seed round" hiring [role]'
      - '"out of stealth" hiring [role]'
      - "raised hiring [role]"

  - id: dice
    surface: open-web
    entry: https://www.dice.com/jobs
    enabled: false
    # Non-US location selections return the US result set unchanged.
    location: keep-only
    formulations:
      - "[role]"

  - id: getonbrd
    surface: open-web
    entry: https://getonbrd.com/jobs
    route_required: true
    route:
      kind: json
      url: https://www.getonbrd.com/api/v0/search/jobs?query={formulation}&per_page=40&page={page}
      pages: meta.total_pages
      items: data
      posting_url: links.public_url
    # Posting URLs may redirect to category paths; retain the opened canonical URL.
    # `/api/v0/jobs/{id}` returns 401, so extract the JD from the posting page.
    # No date filter on this API; `attributes.published_at` is unix seconds.
    formulations:
      - "[role]"
