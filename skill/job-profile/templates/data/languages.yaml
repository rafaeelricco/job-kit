# One object per spoken language.
# Keys: name, level
#
# How a language is printed, and why:
#
#   [name] + [level verbatim]
#
#   name   Language as a form lists it.
#   level  Printed proficiency as-is (e.g. native, C1, B2-C1).
#
#   Rules: never invent a certification, test score, or bare letter grade
#   the owner did not supply. Empty name/level is no answer.

languages:
  - name: "" # TODO
    level: "" # printed proficiency as-is (e.g. native, B2-C1); never invent certs
