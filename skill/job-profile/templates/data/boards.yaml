# One object per employer board on one ATS.
# Keys: ats, slug, company, url, source
# job-scout reads this from the Profile root. Optional; no rows → board packs
# record defect: no_boards.
#
# How a board pack is bound, and why:
#
#   [pack ats] × [rows whose ats matches] → one GET per slug
#
#   ats      greenhouse | lever | ashby
#   slug     the board's path segment, no slash
#   company  printed employer name
#   url      family board URL (jobs.ashbyhq.com/{slug},
#            job-boards.greenhouse.io/{slug}, jobs.lever.co/{slug})
#   source   operator | store (store = boards import from scout dossiers)
#
#   Rules: (ats, slug) is unique. A pack is a surface; a row here is an
#   employer board, never a pack.

boards: []
