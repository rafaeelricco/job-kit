# Screening and authorization facts for job-apply and job-match.
# Keys: availability.notice_period, salary_expectations.salary_range_usd,
#   legal_authorization.jurisdictions[], employment_routes.*,
#   work_preferences_from_resume.*, screening_defaults.*
# job-profile may write screening_defaults.qa[] only; other keys are continue fill.
#
# How an answer is chosen, and why:
#
#   [Fact file] then [derived] then [qa row] then [authored] — never invent
#
#   notice_period      Time before a start. Earliest start is today plus this.
#   salary_range_usd   Our band. Printed job USD numbers win; this band decides
#                      only when the job prints none. Never convert non-USD.
#   jurisdictions      One row per country. Apply reads the matching country
#                      only; never copy a row onto another country.
#   employment_routes  employer_of_record, direct_contractor, local_employment.
#   work_preferences   remote_work, in_person_work, open_to_relocation, verbatim.
#   screening_defaults on_call, hours_overlap, timezone, consent_to_data_processing,
#                      qa[]. Absent key → later apply rules.
#   qa[]               Reusable form answers: question, answer, optional scope
#                      (country | ats | company), source, confirmed_at.
#
#   Rules: no EEO or demographic data in this file. Empty is absent. A Fact
#   file always wins over a qa row. Never invent visa, salary, or notice.

availability:
  notice_period: "" # TODO e.g. "2 weeks"

salary_expectations:
  salary_range_usd: "" # TODO e.g. "80000-120000"

# No self-identification block, deliberately. EEO / demographic questions are
# voluntary and per-employer; answer them in the ATS form at apply time.
# No kit skill stages protected-class data from a file.

legal_authorization:
  jurisdictions: [] # TODO each: {country, work_authorization, legally_allowed_to_work, requires_visa, requires_sponsorship}

employment_routes:
  employer_of_record: "" # Yes | No: gates EOR report eligibility
  direct_contractor: ""
  local_employment: ""

work_preferences_from_resume:
  remote_work: ""
  in_person_work: ""
  in_person_work_note: ""
  open_to_relocation: ""

screening_defaults:
  on_call: ""
  hours_overlap: ""
  timezone: ""
  consent_to_data_processing: ""
  qa: [] # each: {question, answer, scope?, source, confirmed_at}
