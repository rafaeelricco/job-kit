# Intent packs for job discovery. One pack = one surface × one intent.
# impl → file stem under the job-discovery skill references/ (e.g. search-jobs-board).
# [role], [skill:<group>] from data/job_search.yaml positions / keywords.*.
# [industry], [company] from phase-0 profile card.
# Every pack runs every discovery session (YAML order).
# TODO: expand formulations to match the operator's stack after filling job_search.yaml.

max_parallel: 5
extract_batch_size: 10

packs:
  - id: li-jobs-primary
    impl: search-jobs-board
    surface: linkedin_jobs
    entry: https://www.linkedin.com/jobs/
    formulations:
      - "[role] [skill:primary]"
      - "[role] remote OR [skill:hiring_model]"
      - '"Senior" [role] remote'

  - id: hn-whoishiring
    impl: search-open-web
    surface: hn
    entry: https://hnhiring.com
    formulations:
      - "[role] OR [skill:primary]"
      - "[skill:primary] remote OR [skill:hiring_model]"
      - "[role] remote"

  - id: waas
    impl: search-open-web
    surface: waas
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    formulations:
      - "[role] [skill:primary]"
      - "[role] remote OR [skill:hiring_model]"
      - '"Founding Engineer" OR [role]'

  - id: boards-tier1
    impl: search-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_1_high_alpha
    formulations:
      - "[role] [skill:primary]"
      - "[role] remote"
      - "hiring [skill:hiring_model] [skill:primary]"

  - id: boards-tier2
    impl: search-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_2_aggregators
    formulations:
      - "[role] [skill:primary]"
      - "[role] remote OR [skill:hiring_model]"
      - "[skill:primary] engineer remote"

  - id: boards-baseline
    impl: search-open-web
    surface: web_boards
    entry: from data/sources.yaml baseline_floor
    formulations:
      - "[role] remote"
      - "[skill:primary] engineer [skill:hiring_model]"
      - "[role] [skill:primary]"
