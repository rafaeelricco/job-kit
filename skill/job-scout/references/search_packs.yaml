# Intent packs for job scout. One pack = one surface × one intent.
# impl → file stem under this skill's references/ (e.g. surface-linkedin-jobs).
# [role], [skill:<group>] from data/job_search.yaml positions / keywords.*.
# [industry], [company] from phase-0 profile card.
# Every pack runs every discovery session (YAML order).

max_parallel: 5
# SSOT for extract batch size — pipeline + worker must name this key, never hard-code
extract_batch_size: 5

packs:
  - id: li-jobs-product
    impl: surface-linkedin-jobs
    surface: linkedin_jobs
    entry: https://www.linkedin.com/jobs/
    formulations:
      - '"Product Engineer" OR "Founding Product Engineer" OR "AI Product Engineer"'
      - '("Senior Software Engineer" OR "Full Stack" OR "Applied AI") [skill:ai]'
      - '(RAG OR "conversational AI" OR "voice agent" OR "vector database") engineer'

  - id: hn-whoishiring
    impl: surface-open-web
    surface: hn
    entry: https://hnhiring.com
    formulations:
      - '"Product Engineer" OR "product engineering" OR "Founding Engineer"'
      - '(RAG OR LangGraph OR "conversational AI" OR "voice agent") engineer'
      - '("Event Sourcing" OR CQRS OR "end to end" OR "0 to 1") engineer [skill:hiring_model]'

  - id: waas
    impl: surface-open-web
    surface: waas
    entry: https://www.workatastartup.com/companies?demographic=any&hasEquity=any&hasSalary=any&industry=any&interviewProcess=any&jobType=fulltime&layout=list-compact&role=eng&sortBy=created_desc&tab=any&usVisaNotRequired=true
    formulations:
      - '"Product Engineer" OR "Founding Product Engineer" OR "Founding Engineer"'
      - '("Full Stack" OR "Applied AI" OR "AI Engineer" OR FDE) [skill:ai]'
      - '("Event Sourcing" OR CQRS OR multi-tenant) engineer'

  - id: boards-tier1
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_1_high_alpha
    formulations:
      - '"Product Engineer" OR "Founding Product Engineer" OR "AI Product Engineer"'
      - '("Senior Full Stack" OR "Applied AI" OR "AI Engineer" OR FDE) [skill:ai]'
      - '("Event Sourcing" OR CQRS OR multi-tenant) engineer remote'

  - id: boards-tier2
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml tier_2_aggregators
    formulations:
      - '"Product Engineer" OR "Founding Product Engineer" OR "Full Stack Engineer"'
      - '("real-time voice" OR Deepgram OR ElevenLabs OR WebRTC) (AI OR agent) engineer'
      - "full stack (TypeScript OR Python) [skill:ai]"

  - id: boards-baseline
    impl: surface-open-web
    surface: web_boards
    entry: from data/sources.yaml baseline_floor
    formulations:
      - '"Product Engineer" OR "Founding Product Engineer" OR "product engineering"'
      - '("Senior Software Engineer" OR "React Native" OR offline-first) [skill:hiring_model]'
      - '[skill:ai] engineer ("end to end" OR "early-stage" OR "0 to 1")'

  - id: li-jobs-hybrid
    impl: surface-linkedin-jobs
    surface: linkedin_jobs
    entry: https://www.linkedin.com/jobs/
    formulations:
      - '(TypeScript OR React OR "Node.js") Python [skill:ai]'
      - '("Product Engineer" OR "Founding Engineer") ([skill:ai] OR [skill:backend] OR [skill:frontend])'
      - '(WebRTC OR WebSockets OR "low latency" OR barge-in) ([skill:ai] OR engineer)'

  - id: li-posts-en
    impl: surface-social
    surface: linkedin_posts
    entry: https://www.linkedin.com/search/results/content/
    formulations:
      - '("we''re hiring" OR "now hiring") AND ("Product Engineer" OR "Founding Engineer" OR [role])'
      - '"open role" OR "join our team" ([skill:ai] OR [skill:backend])'
      - 'hiring engineer remote ([skill:ai] OR "React Native" OR "Event Sourcing")'

  - id: li-posts-pt
    impl: surface-social
    surface: linkedin_posts
    entry: https://www.linkedin.com/search/results/content/
    formulations:
      - '("estamos contratando" OR "vaga aberta") (remota OR remoto OR exterior OR internacional) ([role] OR engineer)'
      - 'buscamos [skill:ai] (remota OR exterior OR "fora do Brasil")'
      - '"vaga remota" ("Product Engineer" OR "Full Stack" OR [skill:ai]) (exterior OR internacional OR EOR OR Deel)'

  - id: x-dm-me
    impl: surface-social
    surface: x
    entry: https://x.com/search?f=live
    formulations:
      - 'hiring "DM me" engineer remote'
      - '"we''re hiring" ("email me" OR "send CV") engineer'
      - '("founding engineer" OR "product engineer" OR "full stack") hiring (DM OR email)'

  - id: x-funding
    impl: surface-social
    surface: x
    entry: https://x.com/search?f=live
    formulations:
      - '("just raised" OR "Series A" OR "seed round") hiring ("product engineer" OR "AI engineer" OR engineer)'
      - '"out of stealth" hiring (engineer OR founding)'
      - 'raised hiring [skill:ai] (founding OR remote)'

  - id: people-ta
    impl: surface-people
    surface: people
    entry: https://www.linkedin.com/search/results/people/
    formulations:
      - '("Tech Recruiter" OR "Talent Acquisition") [industry]'
      - "Recruiter [company] OR [skill:ai]"
      - '"Engineering Recruiter" ([industry] OR "Applied AI" OR "AI agents")'
